name: Backend CI

on:
  push:
    branches:
      - main
      - master
      - testing
  pull_request:
    branches:
      - main
      - master
      - testing
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: uptime_monitor_test
          POSTGRES_USER: uptime_user
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uptime_user -d uptime_monitor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/api

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://uptime_user:ci_test_password@localhost:5432/uptime_monitor_test
      TEST_DATABASE_URL: postgresql+psycopg://uptime_user:ci_test_password@localhost:5432/uptime_monitor_test
      JWT_SECRET_KEY: ci-only-test-secret-key-do-not-use-in-production
      JWT_ALGORITHM: HS256
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
      CORS_ORIGINS: http://localhost:5173

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run backend tests
        run: python -m pytest -q
